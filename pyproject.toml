[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wcsmatrix"
version = "0.1.0"
description = "Reproduction and frontier-source extensions of Who Covers Whom?"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "numpy>=2,<3", "PyYAML>=6,<7", "python-dotenv>=1,<2", "matplotlib>=3.10,<4"]

[project.optional-dependencies]
gpu = ["torch>=2.10,<3", "transformers>=5.5,<6", "accelerate>=1.5,<2", "bitsandbytes>=0.49,<1", "sentencepiece>=0.2", "protobuf>=5", "pillow>=11", "torchvision>=0.25"]
dev = ["pytest>=8,<10", "ruff>=0.12"]

[project.scripts]
wcsmatrix = "wcsmatrix.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
