  - 0.95
  - 0.99
  modes:
  - realistic
  - strict
  - strict_full
  word_policy: whitespace
  context_mode: chat
  chunk_size: 128
  max_sequence_tokens: 8192
  temperature: 1.0
hardware:
  vram_limit_gib: 38
  reserve_gib: 4
  cpu_memory_gib: 64
