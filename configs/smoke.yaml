name: smoke
prompts: data/prompts/smoke.jsonl
human_texts: data/texts/smoke-human.jsonl
local_texts: data/texts/smoke-local.jsonl
frontier_texts: data/texts/smoke-frontier.jsonl
dataset:
  n: 2
  seed: 42
  min_words: 150
  max_words: 400
  revision: 4d0ff18143b5a7e1b1e79beb540c04549d1e59d3
prompt_template: 'Answer the following question in English, using 150–400 words. Give
  only your answer.


  {question}'
models:
